name: CI

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for the full CI run
        type: choice
        options: [current, arm64]
        default: current
      include_release:
        description: Build the desktop release binary
        type: boolean
        default: true
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 19 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        include:
          - runner: >-
              ${{ (github.event.repository.private
                  && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                  && (inputs.runner == 'arm64' || vars.PRIVATE_ARM64_CI == 'true') && 'rrss-ci-arm64')
                  || vars.CI_RUNNER || 'ubuntu-22.04' }}
    concurrency:
      group: >-
        ${{ (matrix.runner == 'rrss' || matrix.runner == 'rrss-ci-arm64')
            && 'rrss-build-host' || format('ci-hosted-{0}', github.run_id) }}
      queue: max
    uses: ./.github/workflows/ci-jobs.yml
    with:
      runner: ${{ matrix.runner }}
      include_release: ${{ github.event_name != 'workflow_dispatch' || inputs.include_release }}
