name: CI

# 跑在哪由仓库变量 CI_RUNNER 决定，不改这份文件：
# 不设，或设成 ubuntu-22.04 → GitHub 托管；设成 rrss → 只进打了该标签的自托管 runner。
# 自托管 runner 的镜像和缓存卷由维护者另行准备；未设置 CI_RUNNER 时全部用 GitHub 托管。
on:
  workflow_dispatch:
  # 只验证要进 main 的 PR：进功能分支的 PR 等该分支合入 main 时一起验证。
  # 草稿 PR 不跑（见 changes 的 if），转为正式时由 ready_for_review 补跑。
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 托管 runner 和这台 4 核机器都按 4 路编译 / 测试。Docker 的 --cpus 不一定会让 nproc 变成 4。
env:
  CARGO_BUILD_JOBS: "4"
  RUST_TEST_THREADS: "4"
  MAKEFLAGS: "-j4"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  # PR 只跑改到的一侧；push 到 main 与手动触发总是全跑。
  changes:
    # 跳过时其余任务随之跳过，汇总任务 frontend 视为通过。
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: &ci_runner "${{ vars.CI_RUNNER || 'ubuntu-22.04' }}"
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pi/**'
              - 'testdata/**'
              - 'apps/desktop/src/bindings.ts'
              - '.github/workflows/ci.yml'
              - '.github/apt/**'
              - '.github/ci/**'
            frontend:
              - 'apps/desktop/**'
              - 'testdata/**'
              - '.github/workflows/ci.yml'
              - '.github/ci/**'

  checks:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: *ci_runner
    steps:
      - uses: actions/checkout@v5
      - name: Self-hosted cache
        run: bash .github/ci/prepare-runner.sh node
      - uses: pnpm/action-setup@v5
        if: runner.environment != 'self-hosted'
        with:
          version: 10
      - uses: actions/setup-node@v5
        if: runner.environment != 'self-hosted'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Types, hooks, deps, IPC contract and tooling tests
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm check:frontend
          pnpm test:tooling

  # 自托管的几个 runner 共用一台 8 核机器：同机分片只会重复 transform / collect、两份 worker 抢核，
  # 所以自托管只跑一片、限 4 个 worker，另一半核留给同时在跑的 e2e；托管 runner 各在各的机器上，照旧分 2 片。
  unit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    name: unit (${{ matrix.shard }}/${{ (vars.CI_RUNNER && vars.CI_RUNNER != 'ubuntu-22.04') && 1 || 2 }})
    runs-on: *ci_runner
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((vars.CI_RUNNER && vars.CI_RUNNER != 'ubuntu-22.04') && '[1]' || '[1, 2]') }}
    steps:
      - uses: actions/checkout@v5
      - name: Self-hosted cache
        run: bash .github/ci/prepare-runner.sh node
      - uses: pnpm/action-setup@v5
        if: runner.environment != 'self-hosted'
        with:
          version: 10
      - uses: actions/setup-node@v5
        if: runner.environment != 'self-hosted'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Unit tests
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm test --shard=${{ matrix.shard }}/${{ (vars.CI_RUNNER && vars.CI_RUNNER != 'ubuntu-22.04') && 1 || 2 }}${{ runner.environment == 'self-hosted' && ' --maxWorkers=4' || '' }}

  # 全量 e2e 分片并行；本地只跑受影响的用例。自托管同上只跑一片、4 个 worker，与 unit 合起来约占满 8 核。
  e2e:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    name: e2e (${{ matrix.shard }}/${{ (vars.CI_RUNNER && vars.CI_RUNNER != 'ubuntu-22.04') && 1 || 3 }})
    runs-on: *ci_runner
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((vars.CI_RUNNER && vars.CI_RUNNER != 'ubuntu-22.04') && '[1]' || '[1, 2, 3]') }}
    steps:
      - uses: actions/checkout@v5
      - name: Self-hosted cache
        run: bash .github/ci/prepare-runner.sh node
      - uses: pnpm/action-setup@v5
        if: runner.environment != 'self-hosted'
        with:
          version: 10
      - uses: actions/setup-node@v5
        if: runner.environment != 'self-hosted'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          echo "PLAYWRIGHT_VERSION=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"

      # 浏览器按 Playwright 版本缓存；运行镜像自带 Chrome 的系统库，命中时不再装 apt 依赖。
      # 自托管把浏览器放在 /ci-cache，不上传到 GitHub。
      - name: Cache Playwright browsers
        id: playwright-cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright Chromium
        if: runner.environment == 'self-hosted' || steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: e2e
        working-directory: apps/desktop
        run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ (vars.CI_RUNNER && vars.CI_RUNNER != 'ubuntu-22.04') && 1 || 3 }}${{ runner.environment == 'self-hosted' && ' --workers=4' || '' }}

      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results-${{ matrix.shard }}
          path: apps/desktop/test-results/
          retention-days: 7

  # 保留原 `frontend` 检查名，汇总上面三类任务；跳过视为通过。
  frontend:
    needs: [changes, checks, unit, e2e]
    if: always()
    runs-on: *ci_runner
    steps:
      - name: All frontend jobs passed or were skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo ok

  test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows 暂时跳过；恢复时改回
        # '["ubuntu-22.04", "windows-latest"]'（PR 本就只跑 Linux），并给 apt / mold 步骤加上 Linux 条件。
        os: ${{ fromJSON('["ubuntu-22.04"]') }}

    runs-on: *ci_runner
    # 默认 6 小时；挂住时尽早失败。main 含 release 构建，正常约 10 分钟。
    timeout-minutes: 40
    env:
      # CI 测试构建不需要调试符号：编译、链接和缓存都更小更快。
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - name: Self-hosted cache
        run: bash .github/ci/prepare-runner.sh rust${{ github.event_name != 'pull_request' && ' node' || '' }}

      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment != 'self-hosted'

      # 系统依赖的软件列表与 .deb 走缓存：命中时离线安装，不碰 Ubuntu 镜像（镜像曾整步挂住 10 分钟以上）。
      # 键含运行镜像版本与包列表；镜像升级后先用旧缓存试离线安装，版本对不上再联网，由 main 存新缓存。
      # 运行镜像版本只在 shell 环境里，表达式读不到，先导出。自托管的 .deb 在 /ci-cache，不上传。
      - name: Runner image version
        if: runner.environment != 'self-hosted'
        run: echo "RUNNER_IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"
      - name: Restore apt cache
        id: apt-cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache/restore@v5
        with:
          path: ~/.apt-cache
          key: apt-${{ matrix.os }}-${{ hashFiles('.github/apt/packages.txt') }}-${{ env.RUNNER_IMAGE_VERSION }}
          restore-keys: apt-${{ matrix.os }}-${{ hashFiles('.github/apt/packages.txt') }}-

      - name: Install Linux build dependencies
        timeout-minutes: 15
        run: .github/apt/install.sh .github/apt/packages.txt

      # 同 Rust 缓存，只由 main 写。
      - name: Save apt cache
        if: runner.environment != 'self-hosted' && github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.apt-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - uses: rui314/setup-mold@v1

      # 只由 main 写缓存：PR 缓存别的分支读不到，还会挤占仓库 10GB 配额把 main 的缓存挤掉。
      # 自托管用卷上的 CARGO_HOME / CARGO_TARGET_DIR，不走 GitHub 缓存。
      - uses: swatinem/rust-cache@v2
        if: runner.environment != 'self-hosted'
        with:
          shared-key: ${{ matrix.os }}-v3
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # PR 只跑测试，桌面 crate 编译只需要存在的 dist；main / 手动触发才构建真实界面供 release。
      - name: Placeholder frontend dist
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><title>RRSS</title>' > apps/desktop/dist/index.html
          echo "RRSS_SKIP_FRONTEND=1" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5
        if: runner.environment != 'self-hosted' && github.event_name != 'pull_request'
        with:
          version: 10
      - uses: actions/setup-node@v5
        if: runner.environment != 'self-hosted' && github.event_name != 'pull_request'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Frontend build
        if: github.event_name != 'pull_request'
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm build

      - name: Cargo cache status
        if: runner.environment == 'self-hosted'
        run: |
          echo "CARGO_HOME=${CARGO_HOME:-unset}"
          echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR:-unset}"
          du -sh "${CARGO_HOME:-$HOME/.cargo}/registry" "${CARGO_TARGET_DIR:-target}" 2>/dev/null || echo "cargo cache empty"

      # Rust 构建与测试降低调度优先级：机器空闲时照样用满核，和前端测试同机时把 CPU 先让给有超时的 vitest / Playwright。
      - name: cargo test
        run: nice -n 15 cargo test --workspace --exclude rrss-desktop

      # 桌面 crate 没有单测，只确认能编译；check 不做代码生成和链接，省掉整棵 Tauri / WebKit 依赖的测试构建。
      - name: cargo check desktop
        run: nice -n 15 cargo check -p rrss-desktop --all-targets

      - name: cargo build release
        if: github.event_name != 'pull_request'
        run: nice -n 15 cargo build --release -p rrss-desktop

  # Windows 目标只在 CI 里交叉检查：Linux runner + mingw，与 release.yml 的 Windows 包同一路线，只编译不运行。
  # 本地不装 mingw、不跑这一步；平台、网络与 webview 原生改动以这里的结果为准，原生行为仍需真机验证。
  windows-check:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: *ci_runner
    timeout-minutes: 40
    env:
      RRSS_SKIP_FRONTEND: "1"
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v5
      - name: Self-hosted cache
        run: bash .github/ci/prepare-runner.sh rust

      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment != 'self-hosted'
        with:
          targets: x86_64-pc-windows-gnu
      - name: Ensure Rust target (self-hosted)
        if: runner.environment == 'self-hosted'
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install mingw cross toolchain
        timeout-minutes: 15
        run: .github/apt/install.sh .github/apt/windows-cross.txt

      # 同 test：只由 main 写缓存。
      - uses: swatinem/rust-cache@v2
        if: runner.environment != 'self-hosted'
        with:
          shared-key: windows-gnu-check-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # 桌面 crate 只需要存在的 dist，不构建界面。
      - name: Placeholder frontend dist
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><title>RRSS</title>' > apps/desktop/dist/index.html

      - name: cargo check (x86_64-pc-windows-gnu)
        run: nice -n 15 cargo check --locked --target x86_64-pc-windows-gnu --workspace --all-targets
